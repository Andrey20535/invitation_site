<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cream Date? 🍦</title>
    <!-- Tailwind CSS for layout and styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti for the celebration effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts: Fredoka for a cute, bubbly look -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            overflow: hidden; /* Prevent scrolling when button runs away */
            /* Pastel gradient background (mint to soft pink) */
            background: linear-gradient(135deg, #d1fae5 0%, #fce7f3 100%);
            height: 100vh;
            width: 100vw;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .floating-emoji {
            animation: bounce-slow 3s infinite ease-in-out;
        }

        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Styles for the floating ice creams in the celebration screen */
        .ice-cream-shower {
            position: absolute;
            font-size: 2rem;
            z-index: 0;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-20vh) scale(1.5) rotate(360deg);
                opacity: 0;
            }
        }

        /* Make the 'No' button move smoothly but quickly */
        #btn-no {
            transition: all 0.2s ease-out;
        }
        
        .shadow-cute {
            box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.4), 0 8px 10px -6px rgba(236, 72, 153, 0.1);
        }
    </style>
</head>
<body class="relative text-gray-800">

    <!-- MAIN INVITATION VIEW -->
    <div id="main-view" class="flex flex-col items-center justify-center text-center p-6 w-full max-w-2xl z-10 bg-white/40 backdrop-blur-md rounded-3xl shadow-xl border border-white/50 m-4">
        
        <div class="text-6xl mb-6 floating-emoji">
            🍧🍓🍦
        </div>

        <h1 class="text-4xl md:text-5xl font-bold text-pink-500 mb-8 leading-tight">
            Mi Amore 💞,<br>
            <span class="text-3xl md:text-4xl text-gray-700">would you like to go get some ice cream with me?</span>
        </h1>

        <div class="flex flex-row gap-6 relative w-full justify-center h-24 items-center" id="button-container">
            <!-- YES Button -->
            <button id="btn-yes" class="bg-pink-400 hover:bg-pink-500 text-white text-2xl font-bold py-4 px-10 rounded-full shadow-cute transform hover:scale-110 transition-all z-20">
                Yes! 💖
            </button>

            <!-- NO Button (Will run away) -->
            <button id="btn-no" class="bg-white hover:bg-gray-100 text-pink-400 border-2 border-pink-300 text-2xl font-bold py-4 px-10 rounded-full shadow-md z-20 relative">
                No 🧊
            </button>
        </div>
    </div>

    <!-- CELEBRATION VIEW (Hidden by default) -->
    <div id="celebration-view" class="hidden flex-col items-center justify-center text-center p-6 w-full h-full z-10 absolute top-0 left-0">
        <h1 class="text-5xl md:text-7xl font-bold text-pink-500 mb-6 drop-shadow-md z-10">
            Yay! I can't wait! 🍦💕
        </h1>
        <p class="text-2xl text-teal-700 font-semibold z-10">It's a date! 🥰</p>
        
        <!-- Container for dynamically added floating ice creams -->
        <div id="floaters-container" class="absolute inset-0 overflow-hidden pointer-events-none"></div>
    </div>

    <script>
        const noBtn = document.getElementById('btn-no');
        const yesBtn = document.getElementById('btn-yes');
        const mainView = document.getElementById('main-view');
        const celebView = document.getElementById('celebration-view');
        const floatersContainer = document.getElementById('floaters-container');

        // --- "NO" BUTTON DODGE LOGIC ---
        // Function to move the button to a random position
        function dodgeCursor() {
            // Change position to fixed so it can go anywhere on screen
            noBtn.style.position = 'fixed';
            
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            // Calculate max bounds to keep button fully inside the screen
            const maxX = windowWidth - btnWidth - 20;
            const maxY = windowHeight - btnHeight - 20;

            // Generate random X and Y coordinates
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));

            // Apply new position
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Trigger dodge on both mouseover and touchstart (for mobile)
        noBtn.addEventListener('mouseover', dodgeCursor);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent accidental clicking on mobile
            dodgeCursor();
        });

        // --- "YES" BUTTON CELEBRATION LOGIC ---
        yesBtn.addEventListener('click', () => {
            // Hide main view, show celebration view
            mainView.classList.add('hidden');
            celebView.classList.remove('hidden');
            celebView.classList.add('flex');

            // 1. Fire Canvas Confetti
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                // since particles fall down, start a bit higher than random
                confetti(Object.assign({}, defaults, { particleCount,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
                }));
                confetti(Object.assign({}, defaults, { particleCount,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
                }));
            }, 250);

            // 2. Create Floating Ice Creams
            createFloatingIceCreams();
        });

        // Function to create animated floating ice cream emojis
        function createFloatingIceCreams() {
            const emojis = ['🍦', '🍧', '🍨', '💖', '🍓'];
            const numberOfFloaters = 30;

            for (let i = 0; i < numberOfFloaters; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.classList.add('ice-cream-shower');
                    // Random emoji
                    el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    
                    // Random horizontal position (0 to 100vw)
                    el.style.left = Math.random() * 100 + 'vw';
                    
                    // Random animation duration and delay
                    const duration = Math.random() * 3 + 3; // 3 to 6 seconds
                    el.style.animation = `float-up ${duration}s linear forwards`;
                    
                    floatersContainer.appendChild(el);
                    
                    // Clean up DOM after animation ends
                    setTimeout(() => {
                        el.remove();
                    }, duration * 1000);
                }, i * 150); // Stagger the creation for a continuous flow
            }
        }
    </script>
</body>
</html>
